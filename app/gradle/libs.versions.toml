[versions]
agp = "9.4.1"
kotlin = "2.4.21"
compose-multiplatform = "1.12.2"
androidx-compose = "1.12.1"
androidx-activity = "1.13.0"
navigation = "2.10.0"
lifecycle = "2.11.0"
koin = "4.2.2"
coroutines = "1.11.0"
serialization = "1.12.0"
collections-immutable = "0.5.2"
detekt = "1.23.8"
compose-rules = "0.6.8"
spotless = "8.10.4"
ktlint = "1.8.0"
roborazzi = "1.77.0"
robolectric = "4.17"
junit = "4.13.2"
turbine = "1.2.1"
coil = "3.6.3"
sqldelight = "2.4.1"
ktor = "3.5.2"
okio = "3.18.2"
work = "2.12.0"
biometric = "1.1.0"
sqlcipher = "4.20.0"
