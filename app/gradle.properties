# Sized for an 8 GB machine: one JVM, compiler in-process, two workers.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=640m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
# Release unit tests prove the release build binds no dev fakes.
android.onlyEnableUnitTestForTheTestedBuildType=false
