# XcodeGen spec for the thin iOS shell. `xcodegen` writes Kiddo.xcodeproj from this file; the project itself is never
# committed. Run iosApp/setup-mac.sh on a Mac.
name: Kiddo
options:
  bundleIdPrefix: app
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # The Kotlin framework is static and built by Gradle for the active SDK and configuration.
    FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
    # The static framework does not carry its linker flags; SQLDelight's native driver needs the system SQLite.
    OTHER_LDFLAGS: ["$(inherited)", "-framework", "KiddoKit", "-lsqlite3"]
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  Kiddo:
    type: application
    platform: iOS
    sources:
      - path: Kiddo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kiddo
        PRODUCT_NAME: Kiddo
        INFOPLIST_FILE: Kiddo/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    preBuildScripts:
      - name: Build KiddoKit
        basedOnDependencyAnalysis: false
        script: |
          # Xcode runs this without the shell profile: find JDK 17 from the system or Homebrew (both chips).
          for home in "$(/usr/libexec/java_home -v 17 2>/dev/null)" \
            /opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home \
            /usr/local/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home; do
            if [ -n "$home" ] && [ -x "$home/bin/java" ]; then export JAVA_HOME="$home"; break; fi
          done
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
schemes:
  Kiddo:
    build:
      targets:
        Kiddo: all
    run:
      config: Debug
    archive:
      config: Release
